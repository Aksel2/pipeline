[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decision_pipeline"
version = "0.1.0"
description = "Pipeline for decision point rule mining from event logs and understandability metric"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "imodels",
    "interpret",
    "wittgenstein",
    "jsonschema",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_pipeline*"]
exclude = ["tests*"]
